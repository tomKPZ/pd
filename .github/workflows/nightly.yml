# The whole test suite, nightly and on demand (the opt-in tests that download
# Arch packages or a Debian Live image stay manual).  docs/release.md.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLAKE: .

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: ci/free-disk.sh
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702  # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866  # v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the test environment
        run: nix build -j auto --print-build-logs --out-link .testenv .#testenv
      - name: Enable KVM
        run: ci/enable-kvm.sh
      - name: Test suite
        env:
          PD_SKIP_NIX_BUILD: "1"
          PD_TEST_DIR: ${{ runner.temp }}/pd-tests
          PD_KEEP_TEST_DIR: "1"
        run: nix develop .# -c python3 -m unittest discover -v -s tests -t .
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-logs
          path: ${{ runner.temp }}/pd-tests/**/*.log
          if-no-files-found: ignore
          retention-days: 7

